name: Release

# Rakentaa asennuspaketit Windowsille, Linuxille ja macOS:lle ja liittää ne
# tagin GitHub-releaseen. Käynnistyy v*-tagin pushista tai käsin olemassa
# olevalle tagille (Actions → Release → Run workflow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Julkaistava tagi (esim. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      # Käsin ajettaessa koodi otetaan valitusta haarasta; tagi määrää vain releasen
      - uses: actions/checkout@v4

      - name: Asenna Linux-riippuvuudet
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Asenna frontend-riippuvuudet
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Laskutin __VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
